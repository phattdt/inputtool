<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: system-ui;
      width: 420px;
      padding: 12px;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      cursor: pointer;
    }

    #downloadLog {
      background: #28a745;
      color: white;
      margin-top: 5px;
    }

    #downloadLog:hover {
      background: #218838;
    }

    textarea {
      width: 100%;
      height: 120px;
      margin-top: 10px;
      font-size: 12px;
    }

    .row {
      margin-top: 8px;
    }

    small {
      opacity: 0.7;
      display: block;
      margin-top: 8px;
    }
  </style>
</head>

<body>
  <h3>入力補助ツール</h3>

  <div class="row">
    <input id="file" type="file" accept="application/pdf" />
  </div>

  <button id="run">明細書を読み込んで補助</button>
  <button id="downloadLog">Download Log</button>

  <div id="progressContainer" style="display:none; margin-top: 10px;">
    <label id="progressLabel">Processing...</label>
    <progress id="progressBar" value="0" max="100" style="width: 100%;"></progress>
  </div>
  <textarea id="log" readonly placeholder="Logs..."></textarea>

  <div id="progressBar"
    style="width: 100%; background-color: #f3f3f3; border-radius: 5px; margin-top: 10px; display: none;">
    <div id="progress"
      style="width: 0%; height: 20px; background-color: #4CAF50; text-align: center; line-height: 20px; color: white; border-radius: 5px;">
      0%</div>
  </div>

  <script src="ocr_lib/tesseract.min.js"></script>
  <script type="module" src="popup.js"></script>
</body>

</html>
