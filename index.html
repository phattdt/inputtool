<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>明細書入力システム</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      background: white;
      border-radius: 10px;
      padding: 20px 30px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .header h1 {
      color: #2c3e50;
      font-size: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header h1::before {
      content: '';
      width: 4px;
      height: 28px;
      background: linear-gradient(180deg, #667eea, #764ba2);
      border-radius: 2px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 30px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      color: #2c3e50;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid #3498db;
    }

    .back-btn {
      background: #6c757d;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      margin-bottom: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .back-btn:hover {
      background: #5a6268;
    }

    .drawing-number-header {
      background: linear-gradient(135deg, #3498db, #2980b9);
      color: white;
      padding: 15px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 15px;
    }

    th,
    td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid #e0e0e0;
    }

    th {
      background: #3498db;
      color: white;
      font-weight: 500;
      font-size: 13px;
    }

    td input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
    }

    td input:focus {
      outline: none;
      border-color: #3498db;
      box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
    }

    .add-btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
    }

    .add-btn:hover {
      opacity: 0.9;
    }

    .action-btn {
      padding: 5px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      margin-right: 5px;
    }

    .view-btn {
      background: #3498db;
      color: white;
    }

    .delete-btn {
      background: #e74c3c;
      color: white;
    }

    .clickable-cell {
      color: #3498db;
      cursor: pointer;
      text-decoration: underline;
    }

    .section-table {
      margin-bottom: 25px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      padding: 10px 15px;
      border-radius: 6px 6px 0 0;
      color: white;
      margin-bottom: 0;
    }

    .section-title.material {
      background: linear-gradient(135deg, #e74c3c, #c0392b);
    }

    .section-title.material-detail {
      background: linear-gradient(135deg, #e67e22, #d35400);
    }

    .section-title.processing3 {
      background: linear-gradient(135deg, #9b59b6, #8e44ad);
    }

    .section-title.processing2 {
      background: linear-gradient(135deg, #3498db, #2980b9);
    }

    .section-title.parts {
      background: linear-gradient(135deg, #27ae60, #229954);
    }

    .section-title.packaging {
      background: linear-gradient(135deg, #1abc9c, #16a085);
    }

    .section-title.transport {
      background: linear-gradient(135deg, #34495e, #2c3e50);
    }

    .section-title.other {
      background: linear-gradient(135deg, #7f8c8d, #6c757d);
    }

    .section-title.mold {
      background: linear-gradient(135deg, #f39c12, #e67e22);
    }

    .section-title.management {
      background: linear-gradient(135deg, #95a5a6, #7f8c8d);
    }

    .section-title.profit {
      background: linear-gradient(135deg, #2ecc71, #27ae60);
    }

    .section-content {
      padding: 15px;
      background: #fafbfc;
      border: 1px solid #eee;
      border-radius: 0 0 6px 6px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }

    .form-group input,
    .form-group select {
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
    }

    .hidden {
      display: none;
    }

    .row-number {
      background: #f8f9fa;
      color: #6c757d;
      font-weight: 500;
      width: 50px;
    }

    .actions-cell {
      width: 120px;
    }

    .detail-row {
      border: 1px solid #eee;
      border-radius: 8px;
      margin-bottom: 15px;
      padding: 15px;
      background: white;
    }

    .detail-row-header {
      font-weight: 600;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>明細書入力システム</h1>
    </div>

    <!-- First Form: Parts List (見積書) -->
    <div id="partsListForm" class="card">
      <h2 class="card-title">見積書リスト</h2>
      <table id="partsTable">
        <thead>
          <tr>
            <th style="width: 50px;">No.</th>
            <th>図面番号</th>
            <th>見積書番号</th>
            <th>事部コード</th>
            <th>工程</th>
            <th>累進</th>
            <th>品名仕様</th>
            <th>備考</th>
            <th style="width: 120px;">操作</th>
          </tr>
        </thead>
        <tbody id="partsTableBody">
        </tbody>
      </table>
      <button class="add-btn" onclick="addPartRow()">
        <span>+</span> 追加
      </button>
    </div>

    <!-- Second Form: Detail View -->
    <div id="detailForm" class="card hidden">
      <button class="back-btn" onclick="goBack()">
        <span>←</span> 戻る
      </button>
      <div id="drawingNumberHeader" class="drawing-number-header"></div>

      <!-- Section 2: 材料費（樹脂） -->
      <div class="section-table">
        <div class="section-title material">材料費（樹脂）</div>
        <div class="section-content">
          <div class="form-grid" id="materialResinForm">
            <!-- Rendered by JS -->
          </div>
        </div>
      </div>

      <!-- Section 3: 材料費（樹脂）明細 -->
      <div class="section-table">
        <div class="section-title material-detail">材料費（樹脂）明細</div>
        <div id="materialDetailBody"></div>
        <button class="add-btn" onclick="addMaterialDetailRow()">
          <span>+</span> 追加
        </button>
      </div>

      <!-- Section 4: 加工費（パターン３） -->
      <div class="section-table">
        <div class="section-title processing3">加工費（パターン３）</div>
        <div id="processing3Body"></div>
        <button class="add-btn" onclick="addProcessing3Row()">
          <span>+</span> 追加
        </button>
      </div>

      <!-- Section 5: 加工費（パターン２） -->
      <div class="section-table">
        <div class="section-title processing2">加工費（パターン２）</div>
        <div id="processing2Body"></div>
        <button class="add-btn" onclick="addProcessing2Row()">
          <span>+</span> 追加
        </button>
      </div>

      <!-- Section 6: 部品費 -->
      <div class="section-table">
        <div class="section-title parts">部品費</div>
        <div id="partsDetailBody"></div>
        <button class="add-btn" onclick="addPartsDetailRow()">
          <span>+</span> 追加
        </button>
      </div>

      <!-- Section 7: 梱包費 -->
      <div class="section-table">
        <div class="section-title packaging">梱包費</div>
        <div id="packagingBody"></div>
        <button class="add-btn" onclick="addPackagingRow()">
          <span>+</span> 追加
        </button>
      </div>

      <!-- Section 8: 輸送費 -->
      <div class="section-table">
        <div class="section-title transport">輸送費</div>
        <div class="section-content">
          <div class="form-grid" id="transportForm">
            <!-- Rendered by JS -->
          </div>
        </div>
      </div>

      <!-- Section 9: その他費 -->
      <div class="section-table">
        <div class="section-title other">その他費</div>
        <div class="section-content">
          <div class="form-grid" id="otherCostForm">
            <!-- Rendered by JS -->
          </div>
        </div>
      </div>

      <!-- Section 10: 金型費 -->
      <div class="section-table">
        <div class="section-title mold">金型費</div>
        <div class="section-content">
          <div class="form-grid" id="moldCostForm">
            <!-- Rendered by JS -->
          </div>
        </div>
      </div>

      <!-- Section 11: 管理費 -->
      <div class="section-table">
        <div class="section-title management">管理費</div>
        <div class="section-content">
          <div class="form-grid" id="managementForm">
            <!-- Rendered by JS -->
          </div>
        </div>
      </div>

      <!-- Section 12: 利益 -->
      <div class="section-table">
        <div class="section-title profit">利益</div>
        <div class="section-content">
          <div class="form-grid" id="profitForm">
            <!-- Rendered by JS -->
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // Data storage - exposed to window for bookmark access
    let partsData = [];
    window.detailData = {};
    window.currentDrawingNumber = null;

    function generateId() {
      return 'id_' + Math.random().toString(36).substr(2, 9);
    }

    // ========== PARTS LIST (見積書) ==========
    function init() {
      for (let i = 0; i < 10; i++) {
        partsData.push({
          id: generateId(),
          drawingNumber: '',
          quoteNumber: '',
          deptCode: '',
          process: '',
          progressive: '',
          productName: '',
          remarks: ''
        });
      }
      renderPartsTable();
    }

    function renderPartsTable() {
      const tbody = document.getElementById('partsTableBody');
      tbody.innerHTML = '';

      partsData.forEach((part, index) => {
        const row = document.createElement('tr');
        const hasData = part.drawingNumber || part.quoteNumber || part.deptCode || part.process || part.progressive || part.productName || part.remarks;

        row.innerHTML = `
          <td class="row-number">${index + 1}</td>
          <td>
            <input type="text" value="${part.drawingNumber}" 
              onchange="updatePart(${index}, 'drawingNumber', this.value)"
              ${part.drawingNumber ? 'class="clickable-cell" onclick="viewDetail(\'' + part.drawingNumber + '\')" readonly' : ''}>
          </td>
          <td><input type="text" value="${part.quoteNumber}" onchange="updatePart(${index}, 'quoteNumber', this.value)"></td>
          <td><input type="text" value="${part.deptCode}" onchange="updatePart(${index}, 'deptCode', this.value)"></td>
          <td><input type="text" value="${part.process}" onchange="updatePart(${index}, 'process', this.value)"></td>
          <td><input type="text" value="${part.progressive}" onchange="updatePart(${index}, 'progressive', this.value)"></td>
          <td><input type="text" value="${part.productName}" onchange="updatePart(${index}, 'productName', this.value)"></td>
          <td><input type="text" value="${part.remarks}" onchange="updatePart(${index}, 'remarks', this.value)"></td>
          <td class="actions-cell">
            ${part.drawingNumber ? `<button class="action-btn view-btn" onclick="viewDetail('${part.drawingNumber}')">詳細</button>` : ''}
            ${hasData ? `<button class="action-btn delete-btn" onclick="deletePart(${index})">削除</button>` : ''}
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    function updatePart(index, field, value) {
      partsData[index][field] = value;
      renderPartsTable();
    }

    function addPartRow() {
      partsData.push({
        id: generateId(),
        drawingNumber: '',
        quoteNumber: '',
        deptCode: '',
        process: '',
        progressive: '',
        productName: '',
        remarks: ''
      });
      renderPartsTable();
    }

    function deletePart(index) {
      const drawingNumber = partsData[index].drawingNumber;
      if (drawingNumber && detailData[drawingNumber]) {
        delete detailData[drawingNumber];
      }
      partsData.splice(index, 1);
      renderPartsTable();
    }

    // ========== DETAIL VIEW ==========
    function viewDetail(drawingNumber) {
      window.currentDrawingNumber = drawingNumber;

      if (!detailData[drawingNumber]) {
        detailData[drawingNumber] = createEmptyDetailData();
      }

      document.getElementById('partsListForm').classList.add('hidden');
      document.getElementById('detailForm').classList.remove('hidden');
      document.getElementById('drawingNumberHeader').textContent = '図面番号: ' + drawingNumber;

      renderAllDetailSections();

      if (window.gprocFillLogic && localStorage.getItem('gproc_excel_data')) {
        try {
          window.gprocFillLogic(JSON.parse(localStorage.getItem('gproc_excel_data')));
        } catch (e) { console.error('Excel同期エラー:', e); }
      }
    }

    function createEmptyDetailData() {
      return {
        // Section 2: 材料費（樹脂）
        materialResin: {
          detailNo: '', conversionRate: '1', sourceCurrency: 'JPY', targetCurrency: 'JPY',
          weightUnit: 'KG', productWeight: '', runnerWeight: '', yieldRate: '',
          recycledWeight: '', recoveredWeight: '', recoveredPrice: '', productionLot: '',
          wasteWeight: '', calcPattern: '', displayPattern: '', remarks: ''
        },
        // Section 3: 材料費（樹脂）明細 - multiple rows
        materialDetail: [createEmptyMaterialDetail()],
        // Section 4: 加工費（パターン３）- multiple rows
        processing3: [createEmptyProcessing3()],
        // Section 5: 加工費（パターン２）- multiple rows
        processing2: [createEmptyProcessing2()],
        // Section 6: 部品費 - multiple rows
        partsDetail: [createEmptyPartsDetail()],
        // Section 7: 梱包費 - multiple rows
        packaging: [createEmptyPackaging()],
        // Section 8: 輸送費
        transport: {
          shippingOrigin: '', deliveryDest: '', distance: '', boxHeight: '', boxWidth: '', boxDepth: '',
          weight: '', packageForm: '', transportCategory: '', transportMethod: '', logisticsPrice: '',
          boxQuantity: '', transportQty: '', handlingFee: '', otherFee: '', weightUnit: 'KG', lengthUnit: 'MM', remarks: ''
        },
        // Section 9: その他費
        otherCost: { otherCost: '', item: '', remarks: '' },
        // Section 10: 金型費
        moldCost: {
          moldName: '', storageLocation: '', procurementType: '', paymentMethod: '',
          investmentAmount: '', depreciationCount: '', supplier: '', remarks: ''
        },
        // Section 11: 管理費
        management: { expenseCode: '', ratio: '' },
        // Section 12: 利益
        profit: { expenseCode: '', ratio: '' }
      };
    }

    function createEmptyMaterialDetail() {
      return {
        id: generateId(), procurementType: '', materialCode: '', deliveryForm: '', supplier: '',
        manufacturer: '', color: '', grade: '', deliveryLot: '', blendingRatio: '',
        smallLotEx: '', materialPrice: '', detailType: '', specification: ''
      };
    }

    function createEmptyProcessing3() {
      return {
        id: generateId(), processName: '', processId: '', equipment: '', conversionRate: '1',
        machineRate: '', machineCT: '', yieldRate: '', changeoverTime: '', outputQty: '',
        calcPattern: '3', remarks: '', itemName1: '', itemName2: '', itemName3: '',
        itemName4: '', itemName5: '', itemName6: '', value1: '', value2: '', value3: '',
        value4: '', value5: '', value6: '', lotCount: ''
      };
    }

    function createEmptyProcessing2() {
      return {
        id: generateId(), processName: '', processId: '', conversionRate: '1',
        manRate: '', manCT: '', yieldRate: '', changeoverTime: '', outputQty: '',
        personnel: '', calcPattern: '2', remarks: '', lotCount: ''
      };
    }

    function createEmptyPartsDetail() {
      return {
        id: generateId(), partName: '', modelNumber: '', processClass: '', procurementType: '',
        originCountry: '', supplier: '', manufacturer: '', remarks: '', quantity: '',
        unitPrice: '', daikinDrawingNo: '', vendorDrawingNo: ''
      };
    }

    function createEmptyPackaging() {
      return {
        id: generateId(), detailType: '', quantity: '', unit: '', unitPrice: '',
        rotationCount: '', supplier: '', piecesPerBox: '', materialName: '', specification: '', remarks: ''
      };
    }

    function goBack() {
      document.getElementById('detailForm').classList.add('hidden');
      document.getElementById('partsListForm').classList.remove('hidden');
      window.currentDrawingNumber = null;
    }

    function renderAllDetailSections() {
      renderMaterialResin();
      renderMaterialDetail();
      renderProcessing3();
      renderProcessing2();
      renderPartsDetail();
      renderPackaging();
      renderTransport();
      renderOtherCost();
      renderMoldCost();
      renderManagement();
      renderProfit();
    }

    // ========== Section 2: 材料費（樹脂） ==========
    function renderMaterialResin() {
      const data = detailData[currentDrawingNumber].materialResin;
      const fields = [
        { key: 'detailNo', label: '明細番号' },
        { key: 'conversionRate', label: '換算レート' },
        { key: 'sourceCurrency', label: '換算元通貨' },
        { key: 'targetCurrency', label: '換算先通貨' },
        { key: 'weightUnit', label: '重量単位' },
        { key: 'productWeight', label: '製品重量' },
        { key: 'runnerWeight', label: 'ランナー重量' },
        { key: 'yieldRate', label: '歩留り(%)' },
        { key: 'recycledWeight', label: '再生材重量' },
        { key: 'recoveredWeight', label: '回収材重量' },
        { key: 'recoveredPrice', label: '回収材単価' },
        { key: 'productionLot', label: '生産ロット数' },
        { key: 'wasteWeight', label: '廃却総重量' },
        { key: 'calcPattern', label: '計算パターン' },
        { key: 'displayPattern', label: '表示パターン' },
        { key: 'remarks', label: '備考' }
      ];
      document.getElementById('materialResinForm').innerHTML = fields.map(f => `
        <div class="form-group">
          <label>${f.label}</label>
          <input type="text" value="${data[f.key] || ''}" onchange="updateMaterialResin('${f.key}', this.value)">
        </div>
      `).join('');
    }

    function updateMaterialResin(field, value) {
      detailData[currentDrawingNumber].materialResin[field] = value;
    }

    // ========== Section 3: 材料費（樹脂）明細 ==========
    function renderMaterialDetail() {
      const data = detailData[currentDrawingNumber].materialDetail;
      const container = document.getElementById('materialDetailBody');
      container.innerHTML = '';

      data.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'detail-row';
        div.innerHTML = `
          <div class="detail-row-header" style="color:#d35400;">材料明細 #${index + 1}
            <button class="action-btn delete-btn" onclick="deleteMaterialDetail(${index})" style="float:right;">削除</button>
          </div>
          <div class="form-grid">
            <div class="form-group"><label>調達区分</label><input type="text" value="${item.procurementType || ''}" onchange="updateMaterialDetail(${index}, 'procurementType', this.value)"></div>
            <div class="form-group"><label>材料コード</label><input type="text" value="${item.materialCode || ''}" onchange="updateMaterialDetail(${index}, 'materialCode', this.value)"></div>
            <div class="form-group"><label>納入荷姿</label><input type="text" value="${item.deliveryForm || ''}" onchange="updateMaterialDetail(${index}, 'deliveryForm', this.value)"></div>
            <div class="form-group"><label>購入元</label><input type="text" value="${item.supplier || ''}" onchange="updateMaterialDetail(${index}, 'supplier', this.value)"></div>
            <div class="form-group"><label>メーカー</label><input type="text" value="${item.manufacturer || ''}" onchange="updateMaterialDetail(${index}, 'manufacturer', this.value)"></div>
            <div class="form-group"><label>色</label><input type="text" value="${item.color || ''}" onchange="updateMaterialDetail(${index}, 'color', this.value)"></div>
            <div class="form-group"><label>グレード</label><input type="text" value="${item.grade || ''}" onchange="updateMaterialDetail(${index}, 'grade', this.value)"></div>
            <div class="form-group"><label>デリバリーロット(/回)</label><input type="text" value="${item.deliveryLot || ''}" onchange="updateMaterialDetail(${index}, 'deliveryLot', this.value)"></div>
            <div class="form-group"><label>配合率(%)</label><input type="text" value="${item.blendingRatio || ''}" onchange="updateMaterialDetail(${index}, 'blendingRatio', this.value)"></div>
            <div class="form-group"><label>小ロットEX</label><input type="text" value="${item.smallLotEx || ''}" onchange="updateMaterialDetail(${index}, 'smallLotEx', this.value)"></div>
            <div class="form-group"><label>材料価格</label><input type="text" value="${item.materialPrice || ''}" onchange="updateMaterialDetail(${index}, 'materialPrice', this.value)"></div>
            <div class="form-group"><label>明細区分</label><input type="text" value="${item.detailType || ''}" onchange="updateMaterialDetail(${index}, 'detailType', this.value)"></div>
            <div class="form-group"><label>仕様</label><input type="text" value="${item.specification || ''}" onchange="updateMaterialDetail(${index}, 'specification', this.value)"></div>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function updateMaterialDetail(index, field, value) {
      detailData[currentDrawingNumber].materialDetail[index][field] = value;
    }

    function addMaterialDetailRow() {
      detailData[currentDrawingNumber].materialDetail.push(createEmptyMaterialDetail());
      renderMaterialDetail();
    }

    function deleteMaterialDetail(index) {
      detailData[currentDrawingNumber].materialDetail.splice(index, 1);
      if (detailData[currentDrawingNumber].materialDetail.length === 0) {
        detailData[currentDrawingNumber].materialDetail.push(createEmptyMaterialDetail());
      }
      renderMaterialDetail();
    }

    // ========== Section 4: 加工費（パターン３） ==========
    function renderProcessing3() {
      const data = detailData[currentDrawingNumber].processing3;
      const container = document.getElementById('processing3Body');
      container.innerHTML = '';

      data.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'detail-row';
        div.innerHTML = `
