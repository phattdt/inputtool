<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>明細書入力システム</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      background: white;
      border-radius: 10px;
      padding: 20px 30px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .header h1 {
      color: #2c3e50;
      font-size: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header h1::before {
      content: '';
      width: 4px;
      height: 28px;
      background: linear-gradient(180deg, #667eea, #764ba2);
      border-radius: 2px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 30px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      color: #2c3e50;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid #3498db;
    }

    .back-btn {
      background: #6c757d;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      margin-bottom: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .back-btn:hover {
      background: #5a6268;
    }

    .drawing-number-header {
      background: linear-gradient(135deg, #3498db, #2980b9);
      color: white;
      padding: 15px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 15px;
    }

    th,
    td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid #e0e0e0;
    }

    th {
      background: #3498db;
      color: white;
      font-weight: 500;
      font-size: 13px;
    }

    td input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
    }

    td input:focus {
      outline: none;
      border-color: #3498db;
      box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
    }

    .add-btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
    }

    .add-btn:hover {
      opacity: 0.9;
    }

    .action-btn {
      padding: 5px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      margin-right: 5px;
    }

    .view-btn {
      background: #3498db;
      color: white;
    }

    .delete-btn {
      background: #e74c3c;
      color: white;
    }

    .clickable-cell {
      color: #3498db;
      cursor: pointer;
      text-decoration: underline;
    }

    .section-table {
      margin-bottom: 25px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      padding: 10px 15px;
      border-radius: 6px 6px 0 0;
      color: white;
      margin-bottom: 0;
    }

    .section-title.material {
      background: linear-gradient(135deg, #e74c3c, #c0392b);
    }

    .section-title.material-detail {
      background: linear-gradient(135deg, #e67e22, #d35400);
    }

    .section-title.processing3 {
      background: linear-gradient(135deg, #9b59b6, #8e44ad);
    }

    .section-title.processing2 {
      background: linear-gradient(135deg, #3498db, #2980b9);
    }

    .section-title.parts {
      background: linear-gradient(135deg, #27ae60, #229954);
    }

    .section-title.packaging {
      background: linear-gradient(135deg, #1abc9c, #16a085);
    }

    .section-title.transport {
      background: linear-gradient(135deg, #34495e, #2c3e50);
    }

    .section-title.other {
      background: linear-gradient(135deg, #7f8c8d, #6c757d);
    }

    .section-title.mold {
      background: linear-gradient(135deg, #f39c12, #e67e22);
    }

    .section-title.management {
      background: linear-gradient(135deg, #95a5a6, #7f8c8d);
    }

    .section-title.profit {
      background: linear-gradient(135deg, #2ecc71, #27ae60);
    }

    .section-content {
      padding: 15px;
      background: #fafbfc;
      border: 1px solid #eee;
      border-radius: 0 0 6px 6px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }

    .form-group input,
    .form-group select {
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
    }

    .hidden {
      display: none;
    }

    .row-number {
      background: #f8f9fa;
      color: #6c757d;
      font-weight: 500;
      width: 50px;
    }

    .actions-cell {
      width: 120px;
    }

    .detail-row {
      border: 1px solid #eee;
      border-radius: 8px;
      margin-bottom: 15px;
      padding: 15px;
      background: white;
    }

    .detail-row-header {
      font-weight: 600;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee;
    }

    /* Stepper CSS */
    .stepper-wrapper {
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      position: relative;
    }

    .stepper-wrapper::before {
      content: '';
      position: absolute;
      top: 15px;
      left: 0;
      width: 100%;
      height: 2px;
      background: #e0e0e0;
      z-index: 1;
    }

    .stepper-item {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }

    .stepper-item .step-counter {
      width: 30px;
      height: 30px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      color: #999;
      margin-bottom: 6px;
      transition: all 0.3s;
    }

    .stepper-item.active .step-counter {
      border-color: #3498db;
      background: #3498db;
      color: white;
    }

    .stepper-item.completed .step-counter {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .stepper-item .step-name {
      font-size: 11px;
      color: #999;
      text-align: center;
    }

    .stepper-item.active .step-name {
      color: #3498db;
      font-weight: bold;
    }

    .step-content {
      display: none;
      animation: fadeIn 0.3s;
    }

    .step-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .step-navigation {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #eee;
      padding-top: 20px;
    }

    .nav-btn {
      padding: 10px 25px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }

    .nav-btn.prev {
      background: #f1f2f6;
      color: #57606f;
    }

    .nav-btn.next {
      background: #3498db;
      color: white;
    }

    .nav-btn:hover {
      opacity: 0.9;
    }

    .nav-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>明細書入力システム</h1>
    </div>

    <!-- First Form: Parts List (見積書) -->
    <div id="partsListForm" class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h2 class="card-title" style="margin-bottom: 0;">見積書リスト</h2>
        <button onclick="importTxtFile()" class="btn btn-confirm"
          style="background: linear-gradient(135deg, #27ae60, #229954); color: white; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-size: 14px;">
          📥 TXTインポート
        </button>
      </div>
      <table id="partsTable">
        <thead>
          <tr>
            <th style="width: 50px;">No.</th>
            <th>図面番号</th>
            <th>見積書番号</th>
            <th>事部コード</th>
            <th>工程</th>
            <th>累進</th>
            <th>品名仕様</th>
            <th>備考</th>
            <th style="width: 120px;">操作</th>
          </tr>
        </thead>
        <tbody id="partsTableBody">
        </tbody>
      </table>
      <!-- <button class="add-btn" onclick="addPartRow()">
        <span>+</span> 追加
      </button> -->
    </div>

    <div id="detailForm" class="card hidden">
      <button class="back-btn" onclick="goBack()">
        <span>←</span> 戻る
      </button>

      <!-- Persistent Header -->
      <div id="drawingNumberHeader" class="drawing-number-header"></div>

      <!-- Stepper Header -->
      <div class="stepper-wrapper">
        <div class="stepper-item active" id="stepperStep1">
          <div class="step-counter">1</div>
          <div class="step-name">材料</div>
        </div>
        <div class="stepper-item" id="stepperStep2">
          <div class="step-counter">2</div>
          <div class="step-name">加工</div>
        </div>
        <div class="stepper-item" id="stepperStep3">
          <div class="step-counter">3</div>
          <div class="step-name">部品</div>
        </div>
        <div class="stepper-item" id="stepperStep4">
          <div class="step-counter">4</div>
          <div class="step-name">梱包</div>
        </div>
        <div class="stepper-item" id="stepperStep5">
          <div class="step-counter">5</div>
          <div class="step-name">輸送</div>
        </div>
        <div class="stepper-item" id="stepperStep6">
          <div class="step-counter">6</div>
          <div class="step-name">その他</div>
        </div>
        <div class="stepper-item" id="stepperStep7">
          <div class="step-counter">7</div>
          <div class="step-name">金型</div>
        </div>
        <div class="stepper-item" id="stepperStep8">
          <div class="step-counter">8</div>
          <div class="step-name">管理</div>
        </div>
        <div class="stepper-item" id="stepperStep9">
          <div class="step-counter">9</div>
          <div class="step-name">利益</div>
        </div>
      </div>

      <!-- Step 1: Material (Section 2 & 3) -->
      <div id="step1" class="step-content active">
        <div class="section-table">
          <div class="section-title material">材料費（樹脂）</div>
          <div class="section-content">
            <div class="form-grid" id="materialResinForm"></div>
          </div>
        </div>
        <div class="section-table">
          <div class="section-title material-detail">材料費（樹脂）明細</div>
          <div id="materialDetailBody"></div>
          <!-- <button class="add-btn" onclick="addMaterialDetailRow()"><span>+</span> 追加</button> -->
        </div>
      </div>

      <!-- Step 2: Processing (Section 4 & 5) -->
      <div id="step2" class="step-content">
        <div class="section-table">
          <div class="section-title processing3">加工費（パターン３）</div>
          <div id="processing3Body"></div>
          <!-- <button class="add-btn" onclick="addProcessing3Row()"><span>+</span> 追加</button> -->
        </div>
        <div class="section-table">
          <div class="section-title processing2">加工費（パターン２）</div>
          <div id="processing2Body"></div>
          <!-- <button class="add-btn" onclick="addProcessing2Row()"><span>+</span> 追加</button> -->
        </div>
      </div>

      <!-- Step 3: Parts (Section 6) -->
      <div id="step3" class="step-content">
        <div class="section-table">
          <div class="section-title parts">部品費</div>
          <div id="partsDetailBody"></div>
          <!-- <button class="add-btn" onclick="addPartsDetailRow()"><span>+</span> 追加</button> -->
        </div>
      </div>

      <!-- Step 4: Packaging (Section 7) -->
      <div id="step4" class="step-content">
        <div class="section-table">
          <div class="section-title packaging">梱包費</div>
          <div id="packagingBody"></div>
          <!-- <button class="add-btn" onclick="addPackagingRow()"><span>+</span> 追加</button> -->
        </div>
      </div>

      <!-- Step 5: Transport (Section 8) -->
      <div id="step5" class="step-content">
        <div class="section-table">
          <div class="section-title transport">輸送費</div>
          <div class="section-content">
            <div class="form-grid" id="transportForm"></div>
          </div>
        </div>
      </div>

      <!-- Step 6: Other (Section 9) -->
      <div id="step6" class="step-content">
        <div class="section-table">
          <div class="section-title other">その他費</div>
          <div class="section-content">
            <div class="form-grid" id="otherCostForm"></div>
          </div>
        </div>
      </div>

      <!-- Step 7: Mold (Section 10) -->
      <div id="step7" class="step-content">
        <div class="section-table">
          <div class="section-title mold">金型費</div>
          <div class="section-content">
            <div class="form-grid" id="moldCostForm"></div>
          </div>
        </div>
      </div>

      <!-- Step 8: Management (Section 11) -->
      <div id="step8" class="step-content">
        <div class="section-table">
          <div class="section-title management">管理費</div>
          <div class="section-content">
            <div class="form-grid" id="managementForm"></div>
          </div>
        </div>
      </div>

      <!-- Step 9: Profit (Section 12) -->
      <div id="step9" class="step-content">
        <div class="section-table">
          <div class="section-title profit">利益</div>
          <div class="section-content">
            <div class="form-grid" id="profitForm"></div>
          </div>
        </div>
      </div>

      <!-- Navigation Buttons -->
      <div class="step-navigation">
        <button class="nav-btn prev" id="prevBtn" onclick="prevStep()" disabled>前へ</button>
        <button class="nav-btn next" id="nextBtn" onclick="nextStep()">次へ</button>
      </div>

    </div>
  </div>

  <script>
    // Data storage - exposed to window for bookmark access
    window.partsData = [];
    window.detailData = {};
    window.currentDrawingNumber = null;

    function generateId() {
      return 'id_' + Math.random().toString(36).substr(2, 9);
    }

    // ========== PARTS LIST (見積書) ==========
    function init() {
      for (let i = 0; i < 10; i++) {
        partsData.push({
          id: generateId(),
          drawingNumber: '',
          quoteNumber: '',
          deptCode: '',
          process: '',
          progressive: '',
          productName: '',
          remarks: ''
        });
      }
      renderPartsTable();
    }

    function renderPartsTable() {
      const tbody = document.getElementById('partsTableBody');
      tbody.innerHTML = '';

      partsData.forEach((part, index) => {
        const row = document.createElement('tr');
        const hasData = part.drawingNumber || part.quoteNumber || part.deptCode || part.process || part.progressive || part.productName || part.remarks;

        row.innerHTML = `
          <td class="row-number">${index + 1}</td>
          <td>
            <input type="text" value="${part.drawingNumber}" 
              onchange="updatePart(${index}, 'drawingNumber', this.value)"
              ${part.drawingNumber ? 'class="clickable-cell" onclick="viewDetail(\'' + part.drawingNumber + '\')" readonly' : ''}>
          </td>
          <td><input type="text" value="${part.quoteNumber}" onchange="updatePart(${index}, 'quoteNumber', this.value)"></td>
          <td><input type="text" value="${part.deptCode}" onchange="updatePart(${index}, 'deptCode', this.value)"></td>
          <td><input type="text" value="${part.process}" onchange="updatePart(${index}, 'process', this.value)"></td>
          <td><input type="text" value="${part.progressive}" onchange="updatePart(${index}, 'progressive', this.value)"></td>
          <td><input type="text" value="${part.productName}" onchange="updatePart(${index}, 'productName', this.value)"></td>
          <td><input type="text" value="${part.remarks}" onchange="updatePart(${index}, 'remarks', this.value)"></td>
          <td class="actions-cell">
            ${part.drawingNumber ? `<button class="action-btn view-btn" onclick="viewDetail('${part.drawingNumber}')">詳細</button>` : ''}
            ${hasData ? `<button class="action-btn delete-btn" onclick="deletePart(${index})">削除</button>` : ''}
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    function updatePart(index, field, value) {
      partsData[index][field] = value;
      renderPartsTable();
    }

    function addPartRow() {
      partsData.push({
        id: generateId(),
        drawingNumber: '',
        quoteNumber: '',
        deptCode: '',
        process: '',
        progressive: '',
        productName: '',
        remarks: ''
      });
      renderPartsTable();
    }

    function deletePart(index) {
      const drawingNumber = partsData[index].drawingNumber;
      if (drawingNumber && detailData[drawingNumber]) {
        delete detailData[drawingNumber];
      }
      partsData.splice(index, 1);
      renderPartsTable();
    }

    // ========== TXT IMPORT ==========
    function importTxtFile() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.txt';
      input.style.display = 'none';
      document.body.appendChild(input);

      input.onchange = function (e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function (ev) {
          try {
            const content = ev.target.result;
            const lines = content.split(/\r?\n/).filter(line => line.trim());
            const data = parseTxtContent(lines);

            if (!data || !data.header || !data.header.drawingNumber) {
              alert('TXTファイルからデータを読み取れませんでした。');
              return;
            }

            fillDataFromTxt(data);
            alert('TXTインポートが完了しました！');
            renderPartsTable();
          } catch (err) {
            alert('TXTファイルの解析に失敗しました: ' + err.message);
            console.error(err);
          }
        };
        reader.readAsText(file, 'UTF-8');
      };
      input.click();
    }

    function parseTxtContent(lines) {
      const data = {
        header: {},
        mat06: {},
        matd06: [],
        proc03: [],
        proc02: [],
        part: [],
        pac01: [],
        logi01: {},
        other: {},
        tool: {}
      };

      lines.forEach(function (line) {
        const matches = line.match(/"([^"]*)"/g);
        if (!matches) return;
        const values = matches.map(m => m.replace(/"/g, ''));
        const section = values[0];

        if (section === 'QUOTE') {
          data.header = {
            quoteNumber: values[1] || '',
            deptCode: values[2] || '',
            drawingNumber: values[3] || '',
            process: values[4] || '',
            progressive: values[5] || '',
            productName: values[6] || '',
            remarks: values[7] || ''
          };
        } else if (section === 'MAT06') {
          data.mat06 = {
            detailNo: values[1], quoteNo: values[2], conversionRate: values[3],
            sourceCurrency: values[4], targetCurrency: values[5], weightUnit: values[6],
            productWeight: values[7], runnerWeight: values[8], yieldRate: values[9],
            recycledWeight: values[10], recoveredWeight: values[11], recoveredPrice: values[12],
            productionLot: values[13], wasteWeight: values[14], calcPattern: values[15],
            displayPattern: values[16], remarks: values[17]
          };
        } else if (section === 'MATD06_1') {
          data.matd06.push({
            detailNo: values[1], procurementType: values[2], materialCode: values[3],
            deliveryForm: values[4], supplier: values[5], manufacturer: values[6],
            color: values[7], grade: values[8], deliveryLot: values[9],
            blendingRatio: values[10], smallLotEx: values[11], materialPrice: values[12],
            detailType: values[13], specification: values[14]
          });
        } else if (section === 'PROC03') {
          data.proc03.push({
            detailNo: values[1], processName: values[2], processId: values[3],
            equipment: values[4], conversionRate: values[5], sourceCurrency: values[6],
            targetCurrency: values[7], remarks: values[8], machineRate: values[9],
            machineCT: values[10], yieldRate: values[11], changeoverTime: values[12],
            outputQty: values[13], calcPattern: values[14]
          });
        } else if (section === 'PROC02') {
          data.proc02.push({
            detailNo: values[1], processName: values[2], processId: values[3],
            conversionRate: values[4], sourceCurrency: values[5], targetCurrency: values[6],
            remarks: values[7], manRate: values[8], manCT: values[9], yieldRate: values[10],
            changeoverTime: values[11], outputQty: values[12], personnel: values[13],
            calcPattern: values[14], lotCount: values[15]
          });
        } else if (section === 'PART') {
          data.part.push({
            detailNo: values[1], conversionRate: values[2], sourceCurrency: values[3],
            targetCurrency: values[4], partName: values[5], modelNumber: values[6],
            processClass: values[7], procurementType: values[8], originCountry: values[9],
            supplier: values[10], manufacturer: values[11], remarks: values[12],
            quantity: values[13], unitPrice: values[14], daikinDrawingNo: values[15],
            vendorDrawingNo: values[16]
          });
        } else if (section === 'PAC01') {
          data.pac01.push({
            detailNo: values[1], seqNo: values[2], conversionRate: values[3],
            sourceCurrency: values[4], targetCurrency: values[5], quantity: values[6],
            unit: values[7], unitPrice: values[8], rotationCount: values[9],
            supplier: values[10], piecesPerBox: values[11], materialName: values[12],
            specification: values[13], remarks: values[14]
          });

    // ========== Stepper Logic ==========
    let currentStep = 1;

    function showStep(step) {
      // Hide all steps
      for (let i = 1; i <= 9; i++) {
        const content = document.getElementById('step' + i);
        const indicator = document.getElementById('stepperStep' + i);
        if (content) content.classList.remove('active');
        if (indicator) {
          indicator.classList.remove('active');
          indicator.classList.remove('completed');
          if (i < step) indicator.classList.add('completed');
        }
      }
      // Show current step
      const currentContent = document.getElementById('step' + step);
      const currentIndicator = document.getElementById('stepperStep' + step);

      if (currentContent) currentContent.classList.add('active');
      if (currentIndicator) currentIndicator.classList.add('active');

      currentStep = step;

      // Update buttons
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');

      if (prevBtn) prevBtn.disabled = (step === 1);
      if (nextBtn) {
        if (step === 9) {
          nextBtn.textContent = '完了 (リストへ)';
          nextBtn.onclick = function () { goBack(); };
        } else {
          nextBtn.textContent = '次へ';
          nextBtn.onclick = function () { nextStep(); };
        }
      }
    }

    function nextStep() {
      if (currentStep < 9) {
        showStep(currentStep + 1);
        window.scrollTo(0, 0);
      }
    }

    function prevStep() {
      if (currentStep > 1) {
        showStep(currentStep - 1);
        window.scrollTo(0, 0);
      }
    }

            <div class="form-group"><label>所要量</label><input type="text" value="${item.quantity || ''}" onchange="updatePartsDetail(${index}, 'quantity', this.value)"></div>
            <div class="form-group"><label>単価</label><input type="text" value="${item.unitPrice || ''}" onchange="updatePartsDetail(${index}, 'unitPrice', this.value)"></div>
            <div class="form-group"><label>ダイキン図面番号</label><input type="text" value="${item.daikinDrawingNo || ''}" onchange="updatePartsDetail(${index}, 'daikinDrawingNo', this.value)"></div>
            <div class="form-group"><label>取引先図面番号</label><input type="text" value="${item.vendorDrawingNo || ''}" onchange="updatePartsDetail(${index}, 'vendorDrawingNo', this.value)"></div>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function updatePartsDetail(index, field, value) {
      detailData[currentDrawingNumber].partsDetail[index][field] = value;
    }

    function addPartsDetailRow() {
      detailData[currentDrawingNumber].partsDetail.push(createEmptyPartsDetail());
      renderPartsDetail();
    }

    function deletePartsDetail(index) {
      detailData[currentDrawingNumber].partsDetail.splice(index, 1);
      if (detailData[currentDrawingNumber].partsDetail.length === 0) {
        detailData[currentDrawingNumber].partsDetail.push(createEmptyPartsDetail());
      }
      renderPartsDetail();
    }

    // ========== Section 7: 梱包費 ==========
    function renderPackaging() {
      const data = detailData[currentDrawingNumber].packaging;
      const container = document.getElementById('packagingBody');
      container.innerHTML = '';

      data.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'detail-row';
        div.innerHTML = `
          <div class="detail-row-header" style="color:#16a085;">梱包費 #${index + 1}
            <button class="action-btn delete-btn" onclick="deletePackaging(${index})" style="float:right;">削除</button>
          </div>
          <div class="form-grid">
            <div class="form-group"><label>明細区分</label><input type="text" value="${item.detailType || ''}" onchange="updatePackaging(${index}, 'detailType', this.value)"></div>
            <div class="form-group"><label>所要量</label><input type="text" value="${item.quantity || ''}" onchange="updatePackaging(${index}, 'quantity', this.value)"></div>
            <div class="form-group"><label>単位</label><input type="text" value="${item.unit || ''}" onchange="updatePackaging(${index}, 'unit', this.value)"></div>
            <div class="form-group"><label>単価</label><input type="text" value="${item.unitPrice || ''}" onchange="updatePackaging(${index}, 'unitPrice', this.value)"></div>
            <div class="form-group"><label>回転数</label><input type="text" value="${item.rotationCount || ''}" onchange="updatePackaging(${index}, 'rotationCount', this.value)"></div>
            <div class="form-group"><label>購入元</label><input type="text" value="${item.supplier || ''}" onchange="updatePackaging(${index}, 'supplier', this.value)"></div>
            <div class="form-group"><label>入り数</label><input type="text" value="${item.piecesPerBox || ''}" onchange="updatePackaging(${index}, 'piecesPerBox', this.value)"></div>
            <div class="form-group"><label>材料名</label><input type="text" value="${item.materialName || ''}" onchange="updatePackaging(${index}, 'materialName', this.value)"></div>
            <div class="form-group"><label>仕様</label><input type="text" value="${item.specification || ''}" onchange="updatePackaging(${index}, 'specification', this.value)"></div>
            <div class="form-group"><label>備考</label><input type="text" value="${item.remarks || ''}" onchange="updatePackaging(${index}, 'remarks', this.value)"></div>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function updatePackaging(index, field, value) {
      detailData[currentDrawingNumber].packaging[index][field] = value;
    }

    function addPackagingRow() {
      detailData[currentDrawingNumber].packaging.push(createEmptyPackaging());
      renderPackaging();
    }

    function deletePackaging(index) {
      detailData[currentDrawingNumber].packaging.splice(index, 1);
      if (detailData[currentDrawingNumber].packaging.length === 0) {
        detailData[currentDrawingNumber].packaging.push(createEmptyPackaging());
      }
      renderPackaging();
    }

    // ========== Section 8: 輸送費 ==========
    function renderTransport() {
      const data = detailData[currentDrawingNumber].transport;
      const fields = [
        { key: 'shippingOrigin', label: '出荷元' },
        { key: 'deliveryDest', label: '納入先' },
        { key: 'distance', label: '輸送距離' },
        { key: 'boxHeight', label: '箱サイズ（タテ）' },
        { key: 'boxWidth', label: '箱サイズ（ヨコ）' },
        { key: 'boxDepth', label: '箱サイズ（タカサ）' },
        { key: 'weight', label: '重量' },
        { key: 'packageForm', label: '荷姿' },
        { key: 'transportCategory', label: '輸送カテゴリー' },
        { key: 'transportMethod', label: '輸送手段' },
        { key: 'logisticsPrice', label: '物流単価' },
        { key: 'boxQuantity', label: '箱入り数' },
        { key: 'transportQty', label: '輸送数量' },
        { key: 'handlingFee', label: '荷役費' },
        { key: 'otherFee', label: 'その他費' },
        { key: 'weightUnit', label: '重量単位' },
        { key: 'lengthUnit', label: '長さ単位' },
        { key: 'remarks', label: '備考' }
      ];
      document.getElementById('transportForm').innerHTML = fields.map(f => `
        <div class="form-group">
          <label>${f.label}</label>
          <input type="text" value="${data[f.key] || ''}" onchange="updateTransport('${f.key}', this.value)">
        </div>
      `).join('');
    }

    function updateTransport(field, value) {
      detailData[currentDrawingNumber].transport[field] = value;

      document.getElementById('otherCostForm').innerHTML = fields.map(f => `

        { key: 'procurementType', label: '調達区分' },

    // Initialize on page load
    init();
